    document.documentElement.dataset.theme = savedTheme;
    var savedFont = localStorage.getItem('mifarium.font') || 'forum';
    var validFonts = ['forum', 'manuscript', 'antiqua', 'modern', 'classic', 'script', 'compact'];

      selectedCustom = customFonts.filter(function (f) { return f && f.id === customId; })[0] || null;
    }
    if (selectedCustom) {
      var faceStyle = document.createElement('style');
      faceStyle.id = 'customFontFaces';
      faceStyle.textContent = '@font-face{font-family:"' + selectedCustom.family + '";src:url("' + String(selectedCustom.url || '').replace(/["\\)]/g, '') + '");font-display:swap;}';
      document.head.appendChild(faceStyle);
      document.documentElement.dataset.font = 'custom';
      document.documentElement.style.setProperty('--font-display', '"' + selectedCustom.family + '", Georgia, serif');
      document.documentElement.style.setProperty('--font-serif', '"' + selectedCustom.family + '", Georgia, serif');
      document.documentElement.style.setProperty('--font-sans', '"' + selectedCustom.family + '", "Segoe UI", sans-serif');
    } else {
      if (validFonts.indexOf(savedFont) === -1) savedFont = 'forum';
      document.documentElement.dataset.font = savedFont;
    }
  } catch (e) {}
</script>
